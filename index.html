<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CBSL Maintenance Management System</title><style>html,body{margin:0;background:#f3f6fb}
#cbsl-app{font:14px/1.5 Arial,sans-serif;color:#20324b;background:#f3f6fb;border-radius:12px;overflow:hidden;color-scheme:light}#cbsl-app *{box-sizing:border-box}#cbsl-app button,#cbsl-app input,#cbsl-app select,#cbsl-app textarea{font:inherit}#cbsl-app button{cursor:pointer}#cbsl-app .layout{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:740px;position:relative}#cbsl-app aside{background:#123f84;color:white;padding:25px 14px}#cbsl-app .brand{font-size:25px;letter-spacing:3px;font-weight:bold;padding:0 10px}#cbsl-app small{font-size:12px;color:#687d96}#cbsl-app aside small{color:#bbd2f3;display:block;padding:0 10px;margin-bottom:30px}#cbsl-app nav button{display:block;border:0;background:none;color:#dceaff;width:100%;padding:12px;text-align:left;border-radius:6px;margin:3px 0}#cbsl-app nav button.on{background:#2c66b6;color:white}#cbsl-app main{min-width:0}#cbsl-app header{background:white;border-bottom:1px solid #dfe7f1;padding:16px 24px;padding-right:100px}#cbsl-app .body{padding:24px}#cbsl-app h1{font-size:25px;margin:0 0 4px}#cbsl-app h2{font-size:17px;margin:0 0 14px}#cbsl-app h3{font-size:14px;margin:0 0 5px}#cbsl-app p{margin:0 0 15px}#cbsl-app .heading,#cbsl-app .line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#cbsl-app .heading{margin-bottom:23px}#cbsl-app .line{padding:12px 0;border-bottom:1px solid #e5ebf3}#cbsl-app .button{border:1px solid #dbe3ee;background:white;color:#24466f;border-radius:6px;padding:8px 12px}#cbsl-app .primary{background:#1d61b9;color:white;border-color:#1d61b9}#cbsl-app .panel{background:white;border:1px solid #e0e7f0;border-radius:9px;padding:18px;margin-bottom:18px}#cbsl-app .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}#cbsl-app .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}#cbsl-app .stat{padding:18px;background:white;border:1px solid #e0e7f0;border-radius:8px}#cbsl-app .stat strong{display:block;font-size:28px;margin:7px 0}#cbsl-app .tag{font-size:11px;display:inline-block;padding:3px 7px;border-radius:4px;background:#eaf1fc;color:#235d9f}#cbsl-app .amber{background:#fff0d6;color:#8b5b11}#cbsl-app .green{background:#e1f3e9;color:#236747}#cbsl-app .asset{padding:0;overflow:hidden;text-align:left;background:white;border:1px solid #dfe7f1;border-radius:8px;color:inherit}#cbsl-app .asset div.caption{padding:14px}#cbsl-app .photo{height:100px;background:#e8eef7;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#71859d;font-size:12px;gap:7px;overflow:hidden}#cbsl-app .photo img{width:100%;height:100%;object-fit:cover}#cbsl-app .assethead{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center}#cbsl-app .tabs{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid #dbe4ef;margin:18px 0}#cbsl-app .tabs button{border:0;background:none;padding:10px;color:#6a7e97;border-bottom:3px solid transparent}#cbsl-app .tabs button.on{color:#1b5aaa;border-color:#1b5aaa}#cbsl-app .scroll{overflow-x:auto}#cbsl-app table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}#cbsl-app th{background:#f3f6fb;color:#6b7e94;font-weight:500;padding:11px}#cbsl-app td{border-bottom:1px solid #e4ebf2;padding:12px;vertical-align:top}#cbsl-app td:first-child{min-width:130px}#cbsl-app .notice{font-size:12px;padding:10px 14px;background:#fff4df;color:#825c1e;border-radius:6px;margin-bottom:18px}#cbsl-app label{display:block;font-size:12px;margin-bottom:13px}#cbsl-app input:not([type=checkbox]),#cbsl-app select,#cbsl-app textarea{display:block;width:100%;background:white;border:1px solid #d7e1ed;border-radius:5px;padding:8px;color:#233a56;margin-top:5px}#cbsl-app .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#cbsl-app .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid #e1e8f0;border-top:1px solid #e1e8f0}#cbsl-app .dow{padding:9px;text-align:center;font-size:11px;background:#f1f5fb}#cbsl-app .day{min-height:95px;padding:5px;border-right:1px solid #e1e8f0;border-bottom:1px solid #e1e8f0;font-size:11px}#cbsl-app .day.over{background:#dceaff}#cbsl-app .event{display:block;border:0;border-left:3px solid #2e74cc;border-radius:3px;width:100%;padding:5px;margin-top:5px;background:#e7f0fd;color:#214c82;font-size:11px;text-align:left;overflow-wrap:anywhere}#cbsl-app .event.repair{background:#fff0d8;border-color:#d38a23;color:#79501a}#cbsl-app .overlay{position:absolute;inset:0;background:#10274788;z-index:5;padding:35px 16px;display:flex;align-items:flex-start;justify-content:center}#cbsl-app .dialog{background:white;width:min(570px,100%);padding:24px;border-radius:11px;box-shadow:0 15px 60px #10274730}#cbsl-app .close{float:right}#cbsl-app .empty{padding:30px 10px;text-align:center;color:#6a7e96;font-size:12px}#cbsl-app .timeline{border-left:2px solid #dce5f1;padding-left:17px}#cbsl-app .timeline article{margin:0 0 19px}#cbsl-app .mobilecal{display:none}#cbsl-app .filters{display:flex;gap:12px;flex-wrap:wrap}#cbsl-app .filters label{flex:1;min-width:140px}@media(max-width:760px){#cbsl-app .layout{grid-template-columns:145px minmax(0,1fr)}#cbsl-app .body{padding:15px}#cbsl-app .grid{grid-template-columns:repeat(2,minmax(0,1fr))}#cbsl-app .two{grid-template-columns:1fr}}@media(max-width:520px){#cbsl-app .layout{display:block}#cbsl-app aside{padding:12px}#cbsl-app aside small{display:none}#cbsl-app nav{display:flex;flex-wrap:wrap}#cbsl-app nav button{width:auto;padding:8px;font-size:12px}#cbsl-app header{padding:12px}#cbsl-app .calendar{display:none}#cbsl-app .mobilecal{display:block}#cbsl-app .assethead{grid-template-columns:85px 1fr}#cbsl-app .overlay{padding:12px}#cbsl-app .grid.stats{grid-template-columns:1fr}}
#cbsl-app .assethead .photo{height:150px}#cbsl-app .assethead .photo img{object-fit:contain}
#cbsl-app .photo.landscape{height:auto;aspect-ratio:4/3;width:100%}#cbsl-app .photo.landscape img{object-fit:contain;width:100%;height:100%}#cbsl-app .assethead:has(.photo.landscape){grid-template-columns:minmax(0,240px) minmax(0,1fr)}@media(max-width:760px){#cbsl-app .assethead:has(.photo.landscape){grid-template-columns:minmax(0,180px) minmax(0,1fr)}}@media(max-width:520px){#cbsl-app .assethead:has(.photo.landscape){grid-template-columns:1fr}#cbsl-app .assethead .photo.landscape{max-width:320px}}
#cbsl-app .asset-group{margin-bottom:28px}#cbsl-app .asset-group-heading{display:flex;align-items:center;gap:12px;margin:8px 0 14px}#cbsl-app .asset-group-heading h2{margin:0}#cbsl-app .asset-group-heading span{color:#64748b;font-size:12px}
#cbsl-app h1,#cbsl-app h2,#cbsl-app h3{color:#182b45;opacity:1}

#cbsl-app details.asset-group{margin-bottom:12px;border-bottom:1px solid #dfe7f1}
#cbsl-app details.asset-group>summary.asset-group-heading{display:flex;list-style:none;cursor:pointer;margin:0;padding:16px 0;min-height:52px}
#cbsl-app details.asset-group>summary::-webkit-details-marker{display:none}
#cbsl-app details.asset-group>summary:before{content:'›';color:#182b45;font-size:24px;line-height:1;width:18px;text-align:center;flex-shrink:0;transform:rotate(0deg)}
#cbsl-app details.asset-group[open]>summary:before{transform:rotate(90deg)}
#cbsl-app details.asset-group>summary h2{flex:1}
#cbsl-app details.asset-group>.grid{padding-top:8px}

#cbsl-app .pb-chart{padding:15px 0;display:grid;gap:18px}#cbsl-app .pb-item{max-width:720px}#cbsl-app .pb-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;color:#182b45}#cbsl-app .pb-track{height:17px;background:#e7edf6;border-radius:9px;overflow:hidden}#cbsl-app .pb-bar{height:100%;background:#2764b5;border-radius:9px;min-width:0}#cbsl-app .wo-media{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}#cbsl-app .wo-file{border:1px solid #cad5e7;border-radius:8px;padding:8px 12px;display:inline-block;font-size:12px;text-decoration:none;color:#16457c;background:#f7faff}#cbsl-app .dialog input[type=file]{width:100%;margin:5px 0 8px}#cbsl-app .panel .heading{align-items:center}
</style></head><body><div id="cbsl-app"></div><script>
(()=>{
const root=document.getElementById('cbsl-app');
const assets=[['Waste Water Treatment','TW / IBC'],['Compressed Air System','TW / IBC / Depot'],['Steam System','TW / IBC'],['Cold Water System','TW / IBC'],['Hot Water System','TW / IBC'],['Hot Air System','TW / IBC'],['Chemical Blending System','TW / IBC'],...['B1','B2','B3','A1','A2'].map(n=>['TW Bay '+n,'TW']),...['1','2','3'].map(n=>['IBC Wash '+n,'IBC']),...['A','B','C'].map(n=>['IBC Station '+n,'IBC']),['TW Pressure Washers','TW'],['IBC Pressure Washers','IBC'],['Light-Duty IBC Tote Washer','IBC'],['TW Spinners','TW'],['IBC Spinners','IBC'],['Hot-water boiler','TW / IBC'],['Hot-water tank','TW / IBC'],['Hot-water recirculation','TW / IBC']].map(([name,dept],id)=>({id,name,dept,photo:'',fields:[]}));
assets[1].photo="assets/photo_01.jpg";
assets.find(a=>a.name==="Cold Water System").photo="assets/photo_02.jpg";
assets.find(a=>a.name==="Hot Water System").photo="assets/photo_03.jpg";
assets.find(a=>a.name==="Chemical Blending System").photo="assets/photo_04.jpg";
assets.find(a=>a.name==="Waste Water Treatment").photo="assets/photo_05.jpg";
assets.push({"id": 26, "name": "Building", "dept": "Building", "photo": "assets/photo_06.jpg", "fields": [{"name": "Scope", "value": "General building maintenance"}]});
[23,24,25].forEach(id=>assets[id].parentId=4);
// System containers with individually serviceable equipment (IDs preserve existing work/PM history).
const compressorPhoto=assets[1].photo, miuraPhoto=assets[2].photo;
assets[1].photo='';assets[2].photo='';
function addComponent(name,parent,photo=''){let id=assets.length;assets.push({id,name,dept:assets[parent].dept,photo,fields:[],parentId:parent,showChart:false});return id;}
const eatonId=addComponent('Eaton Compressor — Logik S26',1,compressorPhoto);
const backupId=addComponent('Backup Air Compressor',1);
const miuraId=addComponent('Miura Boiler',2,miuraPhoto);
const kewaneeId=addComponent('Kewanee Boiler',2);
assets[1].fields.push({name:'System equipment',value:'Eaton Logik S26 + backup compressor'});
assets[2].fields.push({name:'System equipment',value:'Miura + Kewanee boilers'});

assets[5].photo="assets/photo_07.jpg";
const pms=[[0,'Clean both pH probes','To confirm','Clean both pH probes'],[2,'Boiler blowdown','To confirm','Confirm procedure before use'],[1,'Weekly compressor inspection','Weekly (Friday)','Clean air filter;Clean external compressor parts;Check unusual noise / vibration;Clean air dryer'],[1,'Monthly compressor inspection','Monthly','Inspect system for leaks;Check oil contamination;Check belt tension and wear'],[1,'Compressor motor greasing','Quarterly','Apply food-grade grease: 2 strokes per site record'],[1,'Polar air dryer drain strainer','Every 6 months','Check and clean drain strainer'],[1,'Change separator filter','4,000 operating hours','Change separator filter'],[1,'Change oil filter','2,000 operating hours','Change oil filter'],[1,'Change oil','8,000 operating hours','Change oil'],[1,'Change air filter','2,000 operating hours','Change air filter'],[1,'Check compress','500 operating hours','Scope requires clarification'],[1,'Check bearings','30,000 operating hours','Check bearings'],[2,'Boiler and water softener service','Every 4 months','Clean feed-water strainer;Clean feed-water tank;Check water quality;Check safety sensors;Clean air filter'],[2,'Safety valve inspection','Annually','Inspect using applicable service procedure'],[2,'UV sensor protector glass','Annually','Clean UV sensor protector glass'],[2,'Boiler motor greasing','Quarterly','Apply food-grade grease: 2 strokes per site record'],[2,'Boiler chemical-control inspection','Monthly','Third-party chemical dosing inspection;Retain service report']].map(([asset,name,freq,steps],id)=>({id,asset,name,freq,steps:steps.split(';')}));
const checks=['Oil recovery tank level','Sulfuric / caustic levels','Mixers operating','Skimmer belts operating','pH in last chamber','Boiler chemical level'].map((name,id)=>({id,name,asset:id===5?2:0,daily:true,numeric:id===4}));
let works=[{id:1,asset:1,name:'Weekly compressor inspection',date:'2026-11-13',status:'Open',tech:'Eduardo Sanchez',priority:'Medium',pm:2},{id:2,asset:0,name:'Mixer not operating',date:'2026-11-12',status:'Open',tech:'Amadis Sanchez',priority:'High',pm:null},{id:3,asset:1,name:'Compressor motor greasing',date:'2026-11-06',status:'Completed',tech:'Eduardo Sanchez',priority:'Medium',pm:4}];
let purchases=[{asset:1,name:'Motor greasing service',date:'2026-11-06',amount:150,category:'Maintenance',reference:'DEMO-PO',work:3}],results=[],custom=[],types=['Preventive','Corrective','Inspection','General Maintenance'];
pms.forEach(p=>{if(p.asset===1)p.asset=eatonId;else if(p.asset===2)p.asset=miuraId;});works.forEach(w=>{if(w.asset===1)w.asset=eatonId;else if(w.asset===2)w.asset=miuraId;});purchases.forEach(p=>{if(p.asset===1)p.asset=eatonId;else if(p.asset===2)p.asset=miuraId;});checks.forEach(c=>{if(c.asset===2)c.asset=miuraId;});
let page='Assets',selected=26,tab='Summary',modal='',message='',month=10,year=2026,filter='',tech='',drag=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(s,act,id='',primary=false)=>`<button class="button ${primary?'primary':''}" data-act="${act}" data-id="${id}">${s}</button>`;
const tag=(s,c='')=>`<span class="tag ${c}">${esc(s)}</span>`;
const opts=(arr,sel='',blank='')=>(blank?`<option value="">${blank}</option>`:'')+arr.map((v,i)=>{let x=typeof v==='string'?v:v.id,n=typeof v==='string'?v:v.name;return `<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(n)}</option>`}).join('');
const photo=a=>`<div class="photo ${[0,3,4,5,6,26].includes(a.id)?'landscape':''}">${a.photo?`<img src="${a.photo}" alt="${esc(a.name)}">`:'<i data-lucide="camera" aria-hidden="true"></i><span>Photo pending</span>'}</div>`;
const card=a=>`<button class="asset" data-act="asset" data-id="${a.id}">${photo(a)}<div class="caption"><h3>${esc(a.name)}</h3><small>${esc(a.dept)}</small></div></button>`;
const table=(h,rows)=>`<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const empty=s=>`<div class="empty">${s}</div>`;
const heading=(h,s,action='')=>`<div class="heading"><div><h1>${h}</h1><small>${s}</small></div><div class="actions">${action}</div></div>`;
const workTable=ws=>ws.length?table(['Work / equipment','Status','Scheduled','Action'],ws.map(w=>[`<h3>${esc(w.name)}</h3><small>${esc(assets[w.asset].name)} · ${esc(w.tech)}</small>`,tag(w.status,w.status==='Completed'?'green':'')+' '+tag(w.priority,'amber'),w.date+'<br><small>Demo</small>',btn('Open','work',w.id)])):empty('No demonstration work orders.');
const pmTable=ps=>ps.length?table(['Preventive service','Frequency',''],ps.map(p=>[`<h3>${esc(p.name)}</h3><small>${esc(assets[p.asset].name)}</small>`,esc(p.freq),btn('Checklist','pm',p.id)])):empty('No PMs configured.');
const buyTable=ps=>ps.length?table(['Purchase','Category','Date','Amount'],ps.map(p=>[`<h3>${esc(p.name)}</h3><small>${esc(p.reference)} · Demo</small>`,esc(p.category),p.date,'$'+p.amount.toFixed(2)])):empty('No demonstration purchases.');
function history(id){let rows=[...results.filter(r=>r.asset===id).map(r=>['Demo session','Inspection: '+r.name,r.value]),...works.filter(w=>w.asset===id).map(w=>[w.date,w.status==='Completed'?'Service completed':'Work order opened',w.name]),...purchases.filter(p=>p.asset===id).map(p=>[p.date,'Purchase recorded',p.name+' · $'+p.amount.toFixed(2)])];return rows.length?`<div class="timeline">${rows.map(r=>`<article><small>${r[0]} · Demo</small><h3>${esc(r[1])}</h3>${esc(r[2])}</article>`).join('')}${works.filter(w=>w.asset===id&&((w.before||[]).length||(w.after||[]).length)).map(w=>`<article><small>${esc(w.date)} · WO #${w.id}</small><h3>${esc(w.name)} · Documentation</h3>${mediaAttachments(w)}</article>`).join('')}</div>`:empty('No demonstration history for this equipment.');}
function daily(list){return `<div class="panel">${list.filter(c=>c.daily).map(c=>`<div class="line"><div><h3>${esc(c.name)}</h3><small>${esc(assets[c.asset].name)}</small></div><label>Response${c.numeric?`<input data-check="${c.id}" type="number" step="0.1" placeholder="pH reading">`:`<select data-check="${c.id}">${opts(['OK','Fail','N/A'],'','Choose')}</select>`}</label></div>`).join('')||empty('No daily inspections configured for this asset.')}<br>${list.some(c=>c.daily)?btn('Save results · Demo','savechecks','',true):''}</div>${results.filter(r=>page!=='Asset'||r.asset===selected).map((r,i)=>`<div class="panel line"><div>${esc(r.name)} ${tag(r.value,r.value==='Fail'?'amber':'green')}</div>${r.value==='Fail'?btn('Open work order','issue',r.id):''}</div>`).join('')}`;}

const chartOptions=['Maintenance cost','Work orders by status','Preventive vs corrective','Downtime hours','Maintenance trends'];
let analyticsMetric='Maintenance cost';
function barChart(metric,assetId=null){
 const scoped=assetId===null?works:works.filter(w=>w.asset===assetId||assets[w.asset]?.parentId===assetId);
 const completed=scoped.filter(w=>w.status==='Completed').length,open=scoped.filter(w=>w.status==='Open').length;
 const spend=purchases.filter(p=>assetId===null||p.asset===assetId||assets[p.asset]?.parentId===assetId).filter(p=>p.category==='Maintenance').reduce((n,p)=>n+p.amount,0);
 const rows=metric==='Maintenance cost'?[['Recorded maintenance',spend],['Other (demo)',0]]:metric==='Work orders by status'?[['Open',open],['Completed',completed]]:metric==='Preventive vs corrective'?[['Preventive',scoped.filter(w=>w.pm!==null).length],['Corrective',scoped.filter(w=>w.pm===null).length]]:metric==='Downtime hours'?[['No downtime data',0]]:[['Work orders',scoped.length],['Completed',completed]];
 const max=Math.max(1,...rows.map(x=>x[1]));
 return `<div class="pb-chart">${rows.map(([name,value])=>`<div class="pb-item"><div class="pb-label"><span>${esc(name)}</span><strong>${metric==='Maintenance cost'?'$':''}${Number(value).toLocaleString()}</strong></div><div class="pb-track"><div class="pb-bar" style="width:${Math.max(0,value/max*100)}%"></div></div></div>`).join('')}</div><p><small>Local demo preview — not a live Power BI report. Connect Power BI through IT for live datasets, custom visuals, security and refresh.</small></p>`;
}
function analytics(){return heading('Analytics & Power BI','Explore maintenance KPIs · Power BI connection is not active')+`<div class="grid stats"><div class="stat"><small>Demo work orders</small><strong>${works.length}</strong><small>Local prototype</small></div><div class="stat"><small>Open work orders</small><strong>${works.filter(w=>w.status==='Open').length}</strong><small>Local prototype</small></div><div class="stat"><small>Recorded maintenance</small><strong>$${purchases.filter(p=>p.category==='Maintenance').reduce((s,p)=>s+p.amount,0).toFixed(2)}</strong><small>Local demo purchases</small></div></div><div class="panel"><h2>Reporting visual</h2><label>Choose a metric<select id="globalmetric">${opts(chartOptions,analyticsMetric)}</select></label>${barChart(analyticsMetric)}</div><div class="panel"><h2>Power BI integration · Planned</h2><p>IT can publish governed Power BI reports and embed authorized visuals here. Asset pages will filter by unique Asset ID. Choose any approved report or metric without hardcoding a single chart.</p><div class="line">Workspace / dataset ${tag('Not connected','amber')}</div><div class="line">Row-level security and permissions ${tag('IT setup required')}</div><div class="line">Refresh and data synchronization ${tag('IT setup required')}</div></div>`;}
function assetAnalytics(a){return `<div class="panel"><div class="heading"><h2>Power BI visual · ${esc(a.name)}</h2>${btn(a.showChart?'Hide chart':'Show chart','charttoggle','',true)}</div>${a.showChart?`<label>Metric<select id="assetmetric">${opts(chartOptions,a.chartMetric||chartOptions[0])}</select></label>${barChart(a.chartMetric||chartOptions[0],a.id)}`:'<p><small>Chart hidden. Show it whenever you need it.</small></p>'}</div>`;}
function mediaAttachments(w){const files=[...(w.before||[]).map(f=>({...f,phase:'Issue / Before'})),...(w.after||[]).map(f=>({...f,phase:'Repair / After'}))];return files.length?`<div class="wo-media">${files.map(f=>`<a href="${f.url}" target="_blank" rel="noopener" class="wo-file">${f.type.startsWith('video/')?'▶':'▣'} ${esc(f.phase)} · ${esc(f.name)}</a>`).join('')}</div>`:'<small>No photo or video documentation for this work order.</small>';}
function getMedia(id){return [...(root.querySelector('#'+id)?.files||[])].filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/')).map(f=>({name:f.name,type:f.type,url:URL.createObjectURL(f)}));}

function assetPage(){let a=assets[selected],ws=works.filter(w=>w.asset===selected),ps=purchases.filter(p=>p.asset===selected);let content='';if(tab==='Summary')content=`<div class="two"><div class="panel"><h2>Equipment details</h2><div class="line">Departments <strong>${esc(a.dept)}</strong></div><div class="line">Allocation <span>${selected===1?'⅓ TW · ⅓ IBC · ⅓ Depot':a.dept==='TW / IBC'?'½ TW · ½ IBC':esc(a.dept)}</span></div>${a.fields.map(f=>`<div class="line">${esc(f.name)}<span>${esc(f.value)}</span></div>`).join('')}</div><div class="panel"><h2>Activity · Demo</h2><div class="line">Open work <strong>${ws.filter(w=>w.status==='Open').length}</strong></div><div class="line">Defined PMs <strong>${pms.filter(p=>p.asset===selected).length}</strong></div><div class="line">Maintenance spending <strong>$${ps.filter(p=>p.category==='Maintenance').reduce((t,p)=>t+p.amount,0).toFixed(2)}</strong></div></div></div><div class="panel"><h2>Recent history · Demo</h2>${history(selected)}</div>`;
if(tab==='Summary')content+=assetAnalytics(a);
if(tab==='Summary'&&assets.some(c=>c.parentId===selected))content+=`<div class="panel"><h2>Components</h2>${assets.filter(c=>c.parentId===selected).map(c=>`<div class="line"><span>${esc(c.name)}</span>${btn('Open','asset',c.id)}</div>`).join('')}</div>`;
if(tab==='Daily Checks')content=daily(checks.filter(c=>c.asset===selected));if(tab==='Scheduled PM')content=`<div class="panel">${pmTable(pms.filter(p=>p.asset===selected))}</div>`;if(tab==='Work Log')content=`<div class="panel">${workTable(ws)}</div>`;if(tab==='Purchases')content=`<div class="panel"><div class="heading"><h2>Purchases · Demo</h2>${btn('+ Purchase','newbuy','',true)}</div>${buyTable(ps)}</div>`;if(tab==='History')content=`<div class="panel"><h2>Full history · Demo</h2>${history(selected)}</div>`;
if(tab==='Spending'){let total=ps.filter(p=>p.category==='Maintenance').reduce((t,p)=>t+p.amount,0),op=ps.filter(p=>p.category!=='Maintenance').reduce((t,p)=>t+p.amount,0),depts=a.dept.split(' / ');content=`<div class="panel"><h2>Spending · Demo</h2><div class="line">Maintenance <strong>$${total.toFixed(2)}</strong></div><div class="line">Operating consumables — excluded <strong>$${op.toFixed(2)}</strong></div><br><h2>Department allocation</h2>${depts.map((d,i)=>`<div class="line">${d}<strong>$${(i===depts.length-1?total-Math.round(total/depts.length*100)/100*(depts.length-1):Math.round(total/depts.length*100)/100).toFixed(2)}</strong></div>`).join('')}</div>`;}
if(a.parentId!=null)content=btn('← '+assets[a.parentId].name,'asset',a.parentId)+content;
return heading('Asset record','Assets / '+esc(a.name),btn('Configure asset','configure','',true))+`<div class="panel assethead">${photo(a)}<div><h1>${esc(a.name)}</h1><p><small>${esc(a.dept)}</small></p><div class="actions">${btn('+ Work order','newwork')}${btn('Calendar','assetcal')}</div></div></div><div class="tabs">${['Summary','Daily Checks','Scheduled PM','Work Log','Purchases','Spending','History'].map(t=>`<button data-act="tab" data-id="${t}" class="${tab===t?'on':''}">${t}</button>`).join('')}</div>${content}`;}
function calendar(){let first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),ws=works.filter(w=>w.status==='Open'&&(!filter||String(w.asset)===filter)&&(!tech||w.tech===tech));let cells='';for(let i=0;i<Math.ceil((first+days)/7)*7;i++){let d=i-first+1,valid=d>0&&d<=days,date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<div class="day" ${valid?`data-drop="${date}"`:''}>${valid?d:''}${valid?ws.filter(w=>w.date===date).map(w=>`<button class="event ${w.pm===null?'repair':''}" draggable="true" data-drag="${w.id}" data-act="work" data-id="${w.id}">${esc(w.name)}<br>${esc(w.tech.split(' ')[0])}</button>`).join(''):''}</div>`;}
return heading('Maintenance calendar','America/Chicago · Demonstration schedule',btn('Apple / Google','connections')+btn('+ Schedule work','newwork','',true))+`<div class="notice">Drag a work item to another date. Choose this occurrence or future scheduled occurrences. Demo dates only.</div><div class="filters"><label>Equipment<select id="calasset">${opts(assets,filter,'All assets')}</select></label><label>Technician<select id="caltech">${opts(['Eduardo Sanchez','Amadis Sanchez'],tech,'All technicians')}</select></label></div><div class="panel"><div class="heading"><div class="actions">${btn('‹','prev')}<h2 style="margin:0">${new Date(year,month).toLocaleString('en-US',{month:'long'})} ${year}</h2>${btn('›','next')}</div><div>${tag('Preventive')} ${tag('Corrective','amber')}</div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div><div class="mobilecal">${workTable(ws)}</div></div><div class="panel"><h2>Hours-based work</h2><small>Meter readings determine when these services are due. No calendar date is assumed.</small>${pmTable(pms.filter(p=>p.id===6||p.id===7))}</div>`;}
function render(){let html='';if(page==='Overview')html=heading('Maintenance overview','Chicago · Equipment, inspections and service',btn('+ Work order','newwork','',true))+`<div class="grid stats"><div class="stat"><small>Registered assets</small><strong>${assets.filter(a=>a.dept!=="Building").length}</strong>${tag('Existing register')}</div><div class="stat"><small>Defined PM services</small><strong>${pms.length}</strong><small>Calendar and operating hours</small></div><div class="stat"><small>Open work · Demo</small><strong>${works.filter(w=>w.status==='Open').length}</strong>${tag('Illustrative activity','amber')}</div></div><div class="two"><div class="panel"><h2>Work to follow up</h2>${works.filter(w=>w.status==='Open').map(w=>`<div class="line"><div><h3>${esc(w.name)}</h3><small>${w.date} · Demo</small></div>${btn('Open','work',w.id)}</div>`).join('')}<br>${btn('View calendar','nav','Calendar',true)}</div><div class="panel"><h2>Essential daily round</h2><div class="line">Waste Water Treatment ${tag('5 checks')}</div><div class="line">Miura Boiler ${tag('1 check')}</div><br>${btn('Start daily checks','nav','Daily Checks',true)}</div></div><div class="grid">${assets.slice(0,3).map(card).join('')}</div>`;
if(page==='Assets'){
const visibleAssets=assets.filter(a=>a.parentId==null);
const groups=[['Shared Systems',visibleAssets.filter(a=>a.dept.includes(' / '))],...['TW','IBC','Depot','Building'].map(dept=>[dept,visibleAssets.filter(a=>a.dept===dept)])];
const known=new Set(groups.flatMap(([,items])=>items.map(a=>a.id)));
const other=visibleAssets.filter(a=>!known.has(a.id));
if(other.length)groups.push(['Other',other]);
html=heading('Assets','Shared systems first, followed by department',btn('+ Add asset','addasset','',true))+groups.filter(([,items])=>items.length).map(([name,items])=>`<details class="asset-group"><summary class="asset-group-heading"><h2>${esc(name)}</h2><span>${items.length} assets</span></summary><div class="grid">${items.map(card).join('')}</div></details>`).join('');
}if(page==='Asset')html=assetPage();if(page==='Daily Checks')html=heading('Daily Checks','Essential operating checks · Demonstration results')+daily(checks);if(page==='Scheduled PM')html=heading('Scheduled PM','Real service definitions · No historic completions assumed',btn('+ New PM','addpm','',true))+`<div class="panel">${pmTable(pms)}</div>`;if(page==='Calendar')html=calendar();if(page==='Work Orders')html=heading('Work orders','Demonstration records linked to equipment',btn('+ Work order','newwork','',true))+`<div class="panel">${workTable(works)}</div>`;if(page==='Purchases')html=heading('Purchases','Demonstration purchases · Record each cost once',btn('+ Purchase','newbuy','',true))+`<div class="panel">${buyTable(purchases)}</div>`;if(page==='Analytics')html=analytics();if(page==='Configuration')html=heading('Configuration','Personalize the system and asset records',btn('+ Custom field','field','system',true))+`<div class="two"><div class="panel"><h2>Work types</h2>${types.map(t=>`<div class="line">${esc(t)} ${tag('Active')}</div>`).join('')}<br>${btn('+ Work type','addtype')}</div><div class="panel"><h2>Additional fields</h2>${custom.map(f=>`<div class="line">${esc(f.name)} ${tag(f.value)}</div>`).join('')||empty('No extra system fields.')}<h2>Calendar connections</h2><p><small>Apple Calendar / Google Calendar</small></p>${btn('Connection settings','connections')}</div></div><div class="panel"><h2>Asset customization</h2><p><small>Add photos, inspection definitions, PMs and custom fields inside each asset.</small></p>${btn('Configure air system','eaton','',true)}</div>`;
root.innerHTML=`<div class="layout"><aside><div class="brand">CBSL</div><small>CHICAGO MAINTENANCE</small><nav>${['Overview','Assets','Daily Checks','Scheduled PM','Calendar','Work Orders','Purchases','Analytics','Configuration'].map(n=>`<button class="${page===n||page==='Asset'&&n==='Assets'?'on':''}" data-act="nav" data-id="${n}">${n}</button>`).join('')}</nav></aside><main><header>Chicago facility · Maintenance &nbsp; ${tag('Interactive demo','amber')}</header><div class="body">${message?`<div class="notice" role="status">${esc(message)}</div>`:''}${html}</div></main>${modal?`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true">${btn('Close','close')}<br><br>${modal}</section></div>`:''}</div>`;if(window.lucide)window.lucide.createIcons();}
const show=s=>{modal=s;render();},val=id=>root.querySelector('#'+id)?.value||'';
function work(id){let w=works.find(w=>w.id===+id),steps=w.pm!==null?pms[w.pm].steps:['Inspect equipment','Perform corrective action','Verify operation'];show(`<h2>${esc(w.name)}</h2><p><small>${esc(assets[w.asset].name)} · Demo</small></p><label>Technician<select id="worker">${opts(['Eduardo Sanchez','Amadis Sanchez'],w.tech)}</select></label><label>Actual service date<input type="date" id="service-date" value="${w.status==='Completed'?w.date:''}"></label><h3>Checklist</h3>${steps.map(s=>`<label><input type="checkbox" class="step" ${w.status==='Completed'?'checked':''}> ${esc(s)}</label>`).join('')}<label>Service notes<textarea id="service-notes">${esc(w.notes||'')}</textarea></label><h3>Documentation · Before & After</h3>${mediaAttachments(w)}${w.status!=='Completed'?`<label>Add issue photos/videos (optional)<input id="service-before" type="file" accept="image/*,video/*" multiple></label><label>After repair photos/videos (optional)<input id="service-after" type="file" accept="image/*,video/*" multiple></label>`:''}<div class="actions">${w.status==='Completed'?tag('Completed · Demo','green'):btn('Complete service · Demo','complete',w.id,true)}${btn('Reschedule','move',w.id)}${btn('Asset history','history',w.asset)}</div>`);}
function move(id,date){let w=works.find(w=>w.id===+id);show(`<h2>Reschedule work</h2><p>${esc(w.name)}</p><label>Planned date<input type="date" id="move-date" value="${date||w.date}"></label><label>Apply to<select id="scope">${opts(['This occurrence only',...(w.pm!==null?['This and future scheduled occurrences']:[])])}</select></label><p><small>Completed service history does not change.</small></p>${btn('Save schedule','savemove',id,true)}`);}
function configure(){let a=assets[selected];show(`<h2>Configure asset</h2><p>${esc(a.name)}</p><div class="line">Inspection definitions ${btn('+ Inspection','addcheck')}</div><div class="line">Preventive maintenance ${btn('+ PM','addpm')}</div><div class="line">Additional fields ${btn('+ Field','field','asset')}</div><br><h3>Include in daily round</h3>${checks.filter(c=>c.asset===selected).map(c=>`<label><input type="checkbox" data-toggle="${c.id}" ${c.daily?'checked':''}> ${esc(c.name)}</label>`).join('')||'<small>No inspections configured yet.</small>'}`);}
function newwork(issue){show(`<h2>New work order · Demo</h2><label>Equipment<select id="woasset">${opts(assets,issue?.asset??selected)}</select></label><label>Work description<input id="wotitle" value="${esc(issue?.name||'')}"></label><label>Priority<select id="wopriority">${opts(['Medium','High','Urgent','Low'],issue?'High':'Medium')}</select></label><label>Technician<select id="wotech">${opts(['Eduardo Sanchez','Amadis Sanchez'])}</select></label><label>Planned date<input id="wodate" type="date" value="2026-11-13"></label><h3>Issue documentation (optional)</h3><label>Before — photos or videos<input id="wobefore" type="file" accept="image/*,video/*" multiple></label><p><small>Attachments are linked to this work order and its asset history. This standalone prototype keeps them only for the current browser session.</small></p>${btn('Create work order','creatework',issue?.id??'',true)}`);}
root.addEventListener('click',ev=>{let b=ev.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=b.dataset.id;message='';if(act==='nav'){page=id;modal='';render();}else if(act==='asset'){selected=+id;page='Asset';tab='Summary';render();}else if(act==='tab'){tab=id;render();}else if(act==='charttoggle'){assets[selected].showChart=!assets[selected].showChart;render();}else if(act==='close'){modal='';render();}else if(act==='work')work(id);else if(act==='move')move(id);else if(act==='assetcal'){filter=String(selected);page='Calendar';render();}else if(act==='history'){selected=+id;page='Asset';tab='History';modal='';render();}else if(act==='prev'||act==='next'){month+=act==='next'?1:-1;if(month<0){month=11;year--;}if(month>11){month=0;year++;}render();}
else if(act==='savemove'){if(!val('move-date'))return;let w=works.find(w=>w.id===+id),next=val('move-date'),old=w.date,shift=(new Date(next+'T12:00Z')-new Date(old+'T12:00Z'))/86400000,all=val('scope').includes('future');works.forEach(x=>{if(x.id===w.id||(all&&x.pm===w.pm&&x.status!=='Completed'&&x.date>=old)){let d=new Date(x.date+'T12:00Z');d.setUTCDate(d.getUTCDate()+shift);x.date=d.toISOString().slice(0,10);}});modal='';page='Calendar';message='Demo schedule updated. Completion history unchanged.';render();}
else if(act==='complete'){if([...root.querySelectorAll('.step')].some(x=>!x.checked)||!val('service-date')){root.querySelector('.dialog h2').textContent='Complete checklist and enter service date';return;}let w=works.find(w=>w.id===+id);w.status='Completed';w.date=val('service-date');w.tech=val('worker');w.notes=val('service-notes');w.before=[...(w.before||[]),...getMedia('service-before')];w.after=[...(w.after||[]),...getMedia('service-after')];selected=w.asset;modal='';page='Asset';tab='History';message='Demo service saved in asset history.';render();}
else if(act==='newwork')newwork();else if(act==='issue')newwork(results.find(r=>r.id===+id));else if(act==='creatework'){if(!val('wotitle')||!val('wodate'))return;works.push({id:Date.now(),asset:+val('woasset'),name:val('wotitle'),priority:val('wopriority'),tech:val('wotech'),date:val('wodate'),status:'Open',pm:null,inspection:id,before:getMedia('wobefore'),after:[]});modal='';page='Work Orders';render();}
else if(act==='savechecks'){let ins=[...root.querySelectorAll('[data-check]')].filter(i=>i.value);if(!ins.length)return;ins.forEach(i=>{let c=checks.find(c=>c.id===+i.dataset.check);results.push({...c,id:Date.now()+Math.random(),value:i.value});});message='Demo results saved. Failed checks can create linked work orders.';render();}
else if(act==='pm'){let p=pms[+id];show(`<h2>${esc(p.name)}</h2><p><small>${esc(assets[p.asset].name)} · ${esc(p.freq)}</small></p>${p.steps.map(s=>`<div class="line">${esc(s)}</div>`).join('')}<br>${p.freq.includes('hours')?'<label>Last-service meter<input id="meter" type="number" placeholder="Confirmed reading required"></label>':''}<label>Planned date<input id="pmdate" type="date"></label>${btn('Schedule work · Demo','schedule',id,true)}`);}
else if(act==='schedule'){if(!val('pmdate'))return;let p=pms[+id];if(p.freq.includes('hours')&&!val('meter'))return;works.push({id:Date.now(),asset:p.asset,name:p.name,date:val('pmdate'),status:'Open',priority:'Medium',tech:'Eduardo Sanchez',pm:+id});modal='';page='Calendar';filter=String(p.asset);render();}
else if(act==='configure')configure();else if(act==='eaton'){selected=1;configure();}else if(act==='photo'){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{if(!i.files[0])return;let r=new FileReader();r.onload=()=>{assets[selected].photo=r.result;modal='';page='Asset';tab='Summary';render();};r.readAsDataURL(i.files[0]);};i.click();}
else if(act==='connections')show(`<h2>Calendar connections</h2><div class="line">Apple Calendar ${tag('Not connected')}</div><div class="line">Google Calendar ${tag('Not connected')}</div><br><label>Sync direction<select>${opts(['Read-only subscription','Two-way synchronization — IT evaluation'])}</select></label><label><input type="checkbox"> Scheduled PMs</label><label><input type="checkbox"> Corrective work orders</label><p><small>Proposed settings only. IT must implement authorization, synchronization and conflict handling.</small></p>${btn('Save demo preferences','prefs','',true)}`);else if(act==='prefs'){modal='';message='Preferences saved in this demo. No external account connected.';render();}
else if(act==='field')show(`<h2>Add ${id==='asset'?'asset':'system'} field</h2><label>Field name<input id="fname"></label><label>Type<select id="ftype">${opts(['Text','Number','Predefined choices'])}</select></label><label>Value / choices<input id="fvalue"></label>${btn('Add field','savefield',id,true)}`);else if(act==='savefield'){if(!val('fname'))return;let f={name:val('fname'),value:val('fvalue'),type:val('ftype')};if(id==='asset')assets[selected].fields.push(f);else custom.push(f);modal='';render();}
else if(act==='addtype')show(`<h2>Add work type</h2><label>Name<input id="typename"></label>${btn('Add','savetype','',true)}`);else if(act==='savetype'){if(!val('typename'))return;types.push(val('typename'));modal='';render();}
else if(act==='addcheck')show(`<h2>Add inspection</h2><label>Task<input id="checkname"></label><label>Response type<select id="checktype">${opts(['OK / Fail / N/A','Numeric'])}</select></label><label><input id="dailyflag" type="checkbox"> Essential: include in daily round</label>${btn('Save inspection','createcheck','',true)}`);else if(act==='createcheck'){if(!val('checkname'))return;checks.push({id:Date.now(),asset:selected,name:val('checkname'),numeric:val('checktype')==='Numeric',daily:root.querySelector('#dailyflag').checked});modal='';page='Asset';tab='Daily Checks';render();}
else if(act==='addpm')show(`<h2>Add PM definition</h2><label>Equipment<select id="pmasset">${opts(assets,selected)}</select></label><label>Service name<input id="pmname"></label><label>Frequency<select id="pmfreq">${opts(['Weekly','Every 2 weeks','Monthly','Quarterly','Every 4 months','Every 6 months','Annually','Operating hours'])}</select></label><label>Checklist — one item per line<textarea id="pmsteps"></textarea></label>${btn('Save definition','createpm','',true)}`);else if(act==='createpm'){if(!val('pmname')||!val('pmsteps'))return;pms.push({id:pms.length,asset:+val('pmasset'),name:val('pmname'),freq:val('pmfreq'),steps:val('pmsteps').split('\n')});modal='';page='Scheduled PM';render();}
else if(act==='addasset')show(`<h2>Add asset</h2><label>Name<input id="aname"></label><label>Department(s)<select id="adept">${opts(['TW','IBC','Depot','TW / IBC','TW / IBC / Depot','Building'])}</select></label><p><small>Configure photos, inspections and PMs after creating the asset.</small></p>${btn('Create asset','createasset','',true)}`);else if(act==='createasset'){if(!val('aname'))return;selected=assets.length;assets.push({id:selected,name:val('aname'),dept:val('adept'),photo:'',fields:[]});modal='';page='Asset';tab='Summary';render();}
else if(act==='newbuy')show(`<h2>Record purchase · Demo</h2><label>Equipment<select id="basset">${opts(assets,selected)}</select></label><label>Description<input id="bname"></label><label>Amount ($)<input id="bamount" type="number" min="0" step="0.01"></label><label>Category<select id="bcat">${opts(['Maintenance','Operating Consumable'])}</select></label><label>Related work<select id="bwork">${opts(works.map(w=>({id:w.id,name:assets[w.asset].name+' · '+w.name})),'','No linked work')}</select></label><label>PO / CC reference<input id="bref"></label><label>Purchase date<input id="bdate" type="date"></label>${btn('Save purchase','createbuy','',true)}`);else if(act==='createbuy'){if(!val('bname')||!val('bdate')||val('bamount')===''||+val('bamount')<0)return;let w=works.find(w=>w.id===+val('bwork'));if(w&&w.asset!==+val('basset')){root.querySelector('.dialog h2').textContent='Choose work for the same equipment';return;}purchases.push({asset:+val('basset'),name:val('bname'),amount:+val('bamount'),category:val('bcat'),reference:val('bref')||'Demo',date:val('bdate'),work:val('bwork')});selected=+val('basset');modal='';page='Asset';tab='Purchases';render();}
});
root.addEventListener('change',ev=>{if(ev.target.id==='globalmetric'){analyticsMetric=ev.target.value;render();}if(ev.target.id==='assetmetric'){assets[selected].chartMetric=ev.target.value;render();}if(ev.target.id==='calasset'){filter=ev.target.value;render();}if(ev.target.id==='caltech'){tech=ev.target.value;render();}if(ev.target.dataset.toggle)checks.find(c=>c.id===+ev.target.dataset.toggle).daily=ev.target.checked;});
root.addEventListener('dragstart',ev=>{let x=ev.target.closest('[data-drag]');if(x){drag=x.dataset.drag;ev.dataTransfer.setData('text/plain',drag);}});root.addEventListener('dragover',ev=>{let d=ev.target.closest('[data-drop]');if(d){ev.preventDefault();d.classList.add('over');}});root.addEventListener('dragleave',ev=>ev.target.closest('[data-drop]')?.classList.remove('over'));root.addEventListener('drop',ev=>{let d=ev.target.closest('[data-drop]');if(d){ev.preventDefault();move(ev.dataTransfer.getData('text/plain')||drag,d.dataset.drop);}});render();
})();
</script></body></html>
